<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Admin Login — ePaper</title>

  <link rel="stylesheet" href="css/admin.css" />
 

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .login-page{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .login-box{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:40px;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .login-box h1{
      font-size:32px;
      margin-bottom:10px;
      color:#111827;
      text-align:center;
    }

    .login-box p{
      text-align:center;
      color:#6b7280;
      margin-bottom:25px;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:600;
      color:#111827;
    }

    .form-input{
      width:100%;
      padding:14px;
      border:1px solid #d1d5db;
      border-radius:8px;
      outline:none;
      font-size:15px;
    }

    .form-input:focus{
      border-color:#2563eb;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:#fff;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#1d4ed8;
    }

    .login-error{
      display:none;
      background:#fee2e2;
      color:#dc2626;
      padding:12px;
      border-radius:8px;
      margin-bottom:18px;
      font-size:14px;
    }

    .footer-text{
      text-align:center;
      margin-top:20px;
      font-size:13px;
      color:#6b7280;
    }
  </style>
</head>

<body>

  <div class="login-page">

    <div class="login-box">

      <h1>ePaper Admin</h1>

      <p>Sign in to manage your newspaper</p>

      <div
        class="login-error"
        id="loginError"
      >
        Invalid username or password
      </div>

      <form onsubmit="handleLogin(event)">

        <div class="form-group">

          <label class="form-label">
            Username
          </label>
<input
  class="form-input"
  type="text"
  id="loginUser"
  placeholder="Enter username"
  value="admin"
  autocomplete="username"
  required
/>

<input
  class="form-input"
  type="password"
  id="loginPass"
  placeholder="Enter password"
  value="admin123"
  autocomplete="current-password"
  required
/>

        </div>

        <div class="form-group">

          <label class="form-label">
            Password
          </label>
<input
  class="form-input"
  type="password"
  id="loginPass"
  placeholder="Enter password"
  value="admin123"
  autocomplete="current-password"
  required
/>

        </div>

        <button
          type="submit"
          class="btn"
        >
          Sign In
        </button>

      </form>

      <div class="footer-text">
        Default Login: admin / admin123
      </div>

    </div>

  </div>
 <script src="config.js"></script>
<script>

async function handleLogin(event) {

  event.preventDefault();

  const username =
    document.getElementById("loginUser").value;

  const password =
    document.getElementById("loginPass").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.style.display = "none";

  try {

    const response = await fetch(
      `${CONFIG.API_URL}/api/auth/login`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username: username,
          password: password
        })
      }
    );

    const data = await response.json();

    console.log("LOGIN RESPONSE:", data);

    if (response.ok && data.token) {

      localStorage.setItem(
        "epaper_token",
        data.token
      );

      localStorage.setItem(
        "epaper_user",
        JSON.stringify(data.user)
      );

      window.location.href =
        "./dashboard.html";

    } else {

      errorBox.innerText =
        data.message || "Login failed";

      errorBox.style.display =
        "block";
    }

  } catch (err) {

    console.log(err);

    errorBox.innerText =
      "Server error";

    errorBox.style.display =
      "block";
  }
}

</script>

</body>
</html>
